<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/krishivalaya-logo.jpg" />
    <link rel="apple-touch-icon" href="/krishivalaya-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishivalaya — Empowering the Annadatha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,te,hi,ta,kn,ml,mr,gu,bn,pa,or,as,ur,sa,ne,sd,kok,ks,mai,doi,brx,mni,sat',
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch (e) {
          console.warn('Translate init:', e);
        }
      };
    </script>
    <script async defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
